<title>Fleet (ACQ) star needs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky area tabs on top, responsive grid of hub cards that grow in place to show vehicle-specific zone prices. */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --ink:#211C1C; --muted:#756C6C; --line:#E5DFDD;
  --accent:#C8202B; --accent-soft:#FBE9EA; --accent-ink:#FFFFFF;
  --good:#1F7A4D; --good-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FBF0DB;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.en{unicode-bidi:isolate;direction:ltr;display:inline-block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.search{min-width:0;flex:1 1 220px;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.search::placeholder{color:var(--muted)}
.btn{padding:9px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.status{font-size:.8rem;color:var(--muted)}
.status.ok{color:var(--good)}

.summary{display:flex;flex-wrap:wrap;gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;min-width:130px}
.sum b{font-family:var(--f-num);font-size:1.35rem;font-weight:600;direction:ltr;text-align:start;unicode-bidi:isolate}
.sum span{font-size:.8rem;color:var(--muted)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.tab{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.tab small{font-family:var(--f-num);font-size:.75rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:border-color .15s}
.card.open{border-color:var(--accent)}
.card-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:start}
.card-head .t{flex:1;min-width:0}
.hub{font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:block;overflow-wrap:anywhere}
.meta{font-size:.8rem;color:var(--muted)}
.chev{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.veh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px}
.vb{padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.vb b{font-size:.82rem;font-weight:600}
.vb span{font-size:.72rem;color:var(--muted)}
.vb:hover:not(:disabled){border-color:var(--accent)}
.vb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vb[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.vb:disabled{opacity:.4;cursor:not-allowed}
.panel{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.zone-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.zname{font-weight:600;overflow-wrap:anywhere;min-width:0}
.need{flex:0 0 auto;font-size:1rem;padding:6px 14px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700;white-space:nowrap}
.need .num{font-size:1.1rem;font-weight:700}
.notebox{display:flex;flex-direction:column;gap:4px}
.notelabel{align-self:flex-start;font-size:.85rem;font-weight:700;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:3px 12px;border-radius:999px;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.note{font-size:.95rem;font-weight:600;line-height:1.7;color:var(--ink);margin:0;text-align:right;overflow-wrap:anywhere}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.price{border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:9px 12px;display:flex;flex-direction:column}
.price span{font-size:.72rem;color:var(--muted)}
.price b{font-family:var(--f-num);font-size:1.05rem;font-weight:600;color:var(--ink);direction:ltr;text-align:start;unicode-bidi:isolate}
.price b i{font-style:normal;font-size:.7rem;color:var(--muted);font-weight:500}
.bonus{display:grid;gap:6px;font-size:.88rem;border-top:1px dashed var(--line);padding-top:8px}
.bonus div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bonus span{color:var(--ink);font-weight:700}
.bonus span.wb{color:var(--accent)}
.bonus span.hl{background:#FFE55C;color:#211C1C;padding:1px 8px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bonus .good{color:var(--good);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media (max-width:420px){h1{font-size:1.4rem}.prices{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.overlay{position:fixed;inset:0;background:rgba(33,28,28,.5);z-index:20;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);width:min(1100px,100%);border-radius:18px;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mhead h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.mhead h2 svg{flex:0 0 auto;color:var(--muted)}
.bigbox{background:var(--bg);border-radius:14px;text-align:center;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.bigbox b{font-family:var(--f-num);font-weight:600;font-size:3.4rem;line-height:1.1;direction:ltr;unicode-bidi:isolate}
.bigbox span{color:var(--muted);font-size:.9rem}
.vtabs{display:flex;gap:8px;flex-wrap:wrap}
.vtab{flex:1 1 140px;max-width:260px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:1px}
.vtab b{font-weight:600}
.vtab span{font-size:.75rem;color:var(--muted)}
.vtab:hover:not(:disabled){border-color:var(--accent)}
.vtab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vtab[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.vtab:disabled{opacity:.4;cursor:not-allowed}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.zones .zone{background:var(--bg)}

@media (max-width:520px){.modal{padding:16px 14px 22px}.mhead h2{font-size:1.25rem}.bigbox b{font-size:2.6rem}}

.hubrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.bonus-tag{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);padding:1px 9px;border-radius:999px;animation:bonusblink 1.2s ease-in-out infinite}
.mhead h2 .bonus-tag{font-size:.8rem}
@keyframes bonusblink{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.bonus-tag{animation:none}}

.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(.92)}

.brand{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.brand img{height:40px;width:auto;max-width:100%}
.vline{width:2px;height:36px;background:#F0C9CC;flex:0 0 auto}
h1.fleet{background:linear-gradient(90deg,var(--accent),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:bonusblink 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){h1.fleet{animation:none}}

.vtab.loc{border-style:dashed}
.vtab.loc.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.vtab.loc.done span{color:var(--good)}
.locline{margin:0;font-family:var(--f-num);font-size:.85rem;color:var(--muted);direction:ltr}

.modal{position:relative}
.locpop{position:absolute;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 16px;box-shadow:0 12px 32px rgba(33,28,28,.22);display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 24px)}
.pop-t{font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding-inline-end:28px;overflow-wrap:anywhere}
.pop-a{color:var(--muted);font-size:.95rem;line-height:1.7;text-align:right}
.pop-b{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pop-b .btn{flex:1 1 120px;text-align:center;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:12px}
.pop-b a.btn.primary[aria-disabled="true"]{opacity:.45;pointer-events:none}
.pop-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border:0;background:none;color:var(--muted);border-radius:50%;display:grid;place-items:center}
.pop-x:hover{background:var(--bg);color:var(--ink)}
.pop-arrow{position:absolute;top:-8px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}

.allwrap{display:flex;flex-direction:column;gap:14px;min-width:0}
.allhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.allhead h2{font-family:var(--f-display);font-size:1.3rem;margin:0}
.allhead p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.allgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.ahead b{font-family:var(--f-display);font-size:1.05rem}
.ahead>span{color:var(--accent);font-weight:600;font-size:.85rem}
.atab{overflow-x:auto}
.atab table{width:100%;border-collapse:collapse;font-size:.88rem}
.atab th{text-align:right;color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.atab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.atab tr:last-child td{border-bottom:0}
.atab th:first-child,.atab td:first-child{text-align:left;padding-inline-start:16px}
.atab td:first-child{font-family:var(--f-body);font-weight:600;overflow-wrap:anywhere;min-width:130px}
.atab td.z{color:var(--muted)}
.atab td.tot{font-weight:700}

.asec{display:flex;flex-direction:column;gap:12px;min-width:0}
.asec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:6px}
.asec-h b{font-family:var(--f-display);font-size:1.35rem}
.asec-h>span{color:var(--accent);font-weight:600;font-size:.9rem}
.allwrap{gap:18px}
</style>

    var la=+m[1]+m[2]/60+m[3]/3600, lo=+m[5]+m[6]/60+m[7]/3600;
    if(m[4]==="S") la=-la; if(m[8]==="W") lo=-lo;
    return la.toFixed(6)+","+lo.toFixed(6);
  }
  function closePop(){ var p=document.getElementById("locpop"); if(p) p.remove(); }
  function openPop(btn,h){
    closePop();
    var mEl=$("modal").querySelector(".modal"); if(!mEl) return;
    var tx=locOf(h), ad=ADDR[h.rows[0].hub.toLowerCase()]||"", ll=dmsToDec(tx);
    var pop=document.createElement("div"); pop.id="locpop"; pop.className="locpop"; pop.setAttribute("role","dialog"); pop.setAttribute("aria-label",h.name+" location");
    pop.innerHTML='<button class="pop-x" type="button" data-popclose="1" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
      '<div class="pop-t en">'+esc(h.name)+'</div>'+(ad?'<div class="pop-a" dir="rtl">'+esc(ad)+'</div>':'')+
      '<div class="pop-b"><button class="btn" type="button" data-popcopy="1">Copy Location</button><a class="btn primary" target="_blank" rel="noopener">Open in Maps</a></div><span class="pop-arrow"></span>';
    var an=pop.querySelector("a");
    if(ll) an.href="https://www.google.com/maps/search/?api=1&query="+ll; else an.setAttribute("aria-disabled","true");
    mEl.appendChild(pop);
    var mr=mEl.getBoundingClientRect(), br=btn.getBoundingClientRect();
    var w=Math.min(340,mr.width-24), cx=br.left-mr.left+br.width/2, left=Math.max(12,Math.min(cx-w/2,mr.width-w-12));
    pop.style.width=w+"px"; pop.style.left=left+"px"; pop.style.top=(br.bottom-mr.top+12)+"px";
    pop.querySelector(".pop-arrow").style.left=Math.max(14,Math.min(cx-left-7,w-28))+"px";
  }
  function copyText(t){
    function fb(){ var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ return navigator.clipboard.writeText(t).catch(fb); } }catch(e){}
    fb(); return Promise.resolve();
  }
  function locOf(h){ return LOC[h.rows[0].hub.toLowerCase()]||""; }
  function bonusTag(h){
    return h.rows.some(function(r){return r.oWb||r.nWb;})?'<span class="bonus-tag">Bonus</span>':'';
  }
  var PIN_S='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-inline-end:6px"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  var PIN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  function cardHTML(h){
    var vbs=VEH.map(function(v){
      var rs=h.rows.filter(function(r){return r.type===v[0];});
      return '<button class="vb" type="button" data-hub="'+esc(h.key)+'" data-veh="'+v[0]+'"'+(rs.length?'':' disabled')+'><b>'+v[1]+'</b><span>'+(rs.length?'<span class="num">'+sum(rs)+'</span> needed':'Unavailable')+'</span></button>';
    }).join("");
    return '<article class="card">'+
      '<button class="card-head" type="button" data-open="'+esc(h.key)+'" aria-haspopup="dialog">'+
        '<span class="t"><span class="hubrow"><span class="hub en">'+esc(h.name)+'</span>'+bonusTag(h)+'</span><span class="meta"><span class="num">'+sum(h.rows)+'</span> couriers needed · <span class="num">'+h.rows.length+'</span> zone'+(h.rows.length===1?'':'s')+'</span></span>'+
        '<span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
      '</button><div class="veh">'+vbs+'</div></article>';
  }
  var SNAP="Snapshot of the sheet, Oct 17, 2026";
  function hubInfo(h){
    var c={};
    VEH.forEach(function(v){ c[v[0]]=sum(h.rows.filter(function(r){return r.type===v[0];})); });
    return {name:h.name,s:c.Sedan,m:c.Motorbike,t:c[VEH[2][0]],total:sum(h.rows),zones:h.rows.length,
      bonus:h.rows.some(function(r){return r.oWb||r.nWb;})};
  }
  function allData(){
    return liveAreas().map(function(a){
      var hubs=hubsFor(a);
      var info=hubs.map(hubInfo);
      return {area:a,hubs:hubs,info:info,total:info.reduce(function(x,h){return x+h.total;},0)};
    });
  }
  function totalsOf(d){
    var t={s:0,m:0,t:0,all:0,hubs:0};
    d.forEach(function(a){ a.info.forEach(function(h){ t.s+=h.s; t.m+=h.m; t.t+=h.t; t.all+=h.total; t.hubs++; }); });
    return t;
  }
  function allHTML(){
    var d=allData(), t=totalsOf(d);
    var head='<div class="allhead"><div><h2>All governorates</h2><p>Every hub with its open requests by vehicle type</p></div>'+
      '<button class="btn primary" type="button" id="dlimg" data-dlimg="1">Download image</button></div>';
    var band='<div class="summary">'+
      '<div class="sum"><b>'+t.s+'</b><span>Sedan</span></div>'+
      '<div class="sum"><b>'+t.m+'</b><span>Motorbike</span></div>'+
      '<div class="sum"><b>'+t.t+'</b><span>'+VEH[2][1]+'</span></div>'+
      '<div class="sum"><b>'+t.all+'</b><span>Total couriers</span></div></div>';
    var secs=d.map(function(a){
      return '<section class="asec"><div class="asec-h"><b class="en">'+a.area+'</b><span><span class="num">'+a.total+'</span> needed &middot; <span class="num">'+a.hubs.length+'</span> hubs</span></div>'+
        '<div class="grid">'+a.hubs.map(cardHTML).join("")+'</div></section>';
    }).join("");
    return head+band+secs;
  }

  function loadFonts(){
    try{
      if(!document.fonts||!document.fonts.load) return Promise.resolve();
      return Promise.all([
        document.fonts.load('700 20px "Readex Pro"'),
        document.fonts.load('600 15px "IBM Plex Sans Arabic"'),
        document.fonts.load('600 15px "JetBrains Mono"')
      ]).catch(function(){});
    }catch(e){ return Promise.resolve(); }
  }
  async function drawBoard(){
    var d=allData(), t=totalsOf(d);
    await loadFonts();
    var DISP='"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif';
    var BODY='"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif';
    var NUM='"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace';
    var C={bg:"#F6F4F3",surface:"#FFFFFF",ink:"#211C1C",muted:"#756C6C",line:"#E5DFDD",accent:"#C8202B",soft:"#FBE9EA",off:"#B9B0AF"};
    var SC=2, W=1500, P=40, GAP=16, COLS=3, CW=(W-2*P-(COLS-1)*GAP)/COLS;
    var HEAD=96, BAND=92, SEC=48, CARD=148;
    var top=P+HEAD+BAND+GAP, y=top;
    d.forEach(function(a){ a.y=y; a.rows=Math.ceil(a.info.length/COLS); y+=SEC+a.rows*(CARD+GAP)+10; });
    var H=Math.ceil(y-10-GAP+P);
    var cv=document.createElement("canvas"); cv.width=W*SC; cv.height=H*SC;
    var x=cv.getContext("2d"); x.scale(SC,SC);
    function rr(px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
    function fit(txt,maxW){ if(x.measureText(txt).width<=maxW) return txt; while(txt.length>1&&x.measureText(txt+"\u2026").width>maxW) txt=txt.slice(0,-1); return txt+"\u2026"; }
    x.fillStyle=C.bg; x.fillRect(0,0,W,H);
    // header
    var logo=document.querySelector(".brand img"), lx=P;
    if(logo&&logo.naturalWidth){ var lh=52, lw=logo.naturalWidth/logo.naturalHeight*lh; x.drawImage(logo,P,P,lw,lh); lx=P+lw+22; }
    x.fillStyle="#F0C9CC"; x.fillRect(lx,P+4,2,44); lx+=22;
    x.textBaseline="alphabetic"; x.textAlign="left";
    x.fillStyle=C.accent; x.font="700 36px "+DISP; x.fillText("Fleet (ACQ) star needs",lx,P+38);
    x.fillStyle=C.muted; x.font="400 15px "+BODY; x.fillText("All governorates \u00b7 open requests by hub and vehicle type",lx,P+66);
    x.textAlign="right"; x.font="400 13px "+BODY; x.fillText(SNAP,W-P,P+16); x.textAlign="left";
    // totals
    var items=[["Sedan",t.s],["Motorbike",t.m],[VEH[2][1],t.t],["Total couriers \u00b7 "+t.hubs+" hubs",t.all]];
    var bw=(W-2*P-3*16)/4, by=P+HEAD;
    items.forEach(function(it,i){
      var bx=P+i*(bw+16);
      rr(bx,by,bw,BAND-8,12); x.fillStyle=C.surface; x.fill(); x.strokeStyle=C.line; x.lineWidth=1; x.stroke();
      x.fillStyle=i===3?C.accent:C.ink; x.font="600 34px "+NUM; x.fillText(String(it[1]),bx+20,by+46);
      x.fillStyle=C.muted; x.font="500 14px "+BODY; x.fillText(it[0],bx+20,by+70);
    });
    // areas and hub cards
    var VN=[["Sedan","s"],["Motorbike","m"],[VEH[2][0],"t"]];
    d.forEach(function(a){
      x.fillStyle=C.ink; x.font="700 24px "+DISP; x.fillText(a.area,P,a.y+30);
      x.textAlign="right"; x.fillStyle=C.accent; x.font="600 15px "+NUM; x.fillText(a.total+" needed \u00b7 "+a.info.length+" hubs",W-P,a.y+29); x.textAlign="left";
      a.info.forEach(function(h,i){
        var cx=P+(i%COLS)*(CW+GAP), cy=a.y+SEC+Math.floor(i/COLS)*(CARD+GAP);
        rr(cx,cy,CW,CARD,14); x.fillStyle=C.surface; x.fill(); x.strokeStyle=C.line; x.lineWidth=1; x.stroke();
        // name + bonus pill
        x.fillStyle=C.ink; x.font="700 18px "+DISP;
        var nm=fit(h.name,CW-32-56-(h.bonus?84:0)), nw=x.measureText(nm).width;
        x.fillText(nm,cx+18,cy+34);
        if(h.bonus){
          var px=cx+18+nw+10, pw=64, ph=22, py=cy+34-17;
          rr(px,py,pw,ph,11); x.fillStyle=C.soft; x.fill(); x.strokeStyle=C.accent; x.lineWidth=1; x.stroke();
          x.fillStyle=C.accent; x.font="700 11px "+BODY; x.textAlign="center";
          if("letterSpacing" in x) x.letterSpacing="1px";
          x.fillText("BONUS",px+pw/2+0.5,py+15);
          if("letterSpacing" in x) x.letterSpacing="0px";
          x.textAlign="left";
        }
        x.fillStyle=C.muted; x.font="400 14px "+BODY; x.fillText(h.total+" couriers needed \u00b7 "+h.zones+(h.zones===1?" zone":" zones"),cx+18,cy+57);
        // chevron
        var ccx=cx+CW-32, ccy=cy+34;
        x.beginPath(); x.arc(ccx,ccy,15,0,Math.PI*2); x.fillStyle=C.soft; x.fill();
        x.beginPath(); x.moveTo(ccx-2,ccy-5); x.lineTo(ccx+3,ccy); x.lineTo(ccx-2,ccy+5);
        x.strokeStyle=C.accent; x.lineWidth=2; x.lineCap="round"; x.lineJoin="round"; x.stroke();
        // vehicle boxes
        var vw=(CW-36-16)/3, vy=cy+74, vh=58;
        VN.forEach(function(v,k){
          var vx=cx+18+k*(vw+8), n=h[v[1]], on=n>0;
          rr(vx,vy,vw,vh,10); x.fillStyle=on?C.bg:"#FAF9F8"; x.fill(); x.strokeStyle=on?"#DDD5D3":C.line; x.lineWidth=1; x.stroke();
          x.textAlign="center";
          x.fillStyle=on?C.ink:C.off; x.font="600 14px "+BODY; x.fillText(v[0],vx+vw/2,vy+24);
          x.fillStyle=on?C.muted:C.off; x.font="400 13px "+BODY; x.fillText(on?n+" needed":"Unavailable",vx+vw/2,vy+44);
          x.textAlign="left";
        });
      });
    });
    return new Promise(function(res,rej){ cv.toBlob(function(b){ b?res(b):rej(new Error("toBlob")); },"image/png"); });
  }
  async function downloadImage(btn){
    var old=btn.textContent; btn.disabled=true; btn.textContent="Preparing...";
    try{
      var blob=await drawBoard(), name="Fleet_ACQ_star_needs.png", done=false;
      try{
        if(window.claude&&window.claude.use){
          var dl=await window.claude.use("downloads");
          if(dl){ await dl.save({filename:name,data:blob}); done=true; }
        }
      }catch(err){ if(err&&err.code==="declined") done=true; }
      if(!done){
        var url=URL.createObjectURL(blob), a=document.createElement("a");
        a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
      }
    }catch(e){ setStatus("Could not create the image"); }
    btn.disabled=false; btn.textContent=old;
  }

  function renderGrid(){
    if(area==="All"){ $("grid").innerHTML='<div class="allwrap" style="grid-column:1/-1">'+allHTML()+'</div>'; return; }
    var hubs=hubsFor(area).filter(matches);
    $("grid").innerHTML=hubs.length?hubs.map(cardHTML).join(""):'<div class="empty" style="grid-column:1/-1">No matching hubs.</div>';
  }
  function renderModal(){
    var m=$("modal"), ov=m.querySelector(".overlay"), top=ov?ov.scrollTop:0;
    if(!modal){ m.innerHTML=""; document.body.style.overflow=""; return; }
    var h=hubByKey(modal.key);
    if(!h){ modal=null; m.innerHTML=""; document.body.style.overflow=""; return; }
    var tabs=VEH.map(function(v){
      var rs=h.rows.filter(function(r){return r.type===v[0];});
      return '<button class="vtab" type="button" data-mveh="'+v[0]+'" aria-pressed="'+(modal.veh===v[0])+'"'+(rs.length?'':' disabled')+'><b>'+v[1]+'</b><span>'+(rs.length?sum(rs)+' needed':'Unavailable')+'</span></button>';
    }).join("");
    var lc=locOf(h);
    tabs+=lc?'<button class="vtab loc" type="button" data-loc="1"><b>'+PIN_S+'Location</b><span>Tap to view</span></button>':'<button class="vtab loc" type="button" disabled><b>'+PIN_S+'Location</b><span>Not available</span></button>';
    var rows=h.rows.filter(function(r){return r.type===modal.veh;});
    m.innerHTML='<div class="overlay" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(h.name)+'">'+
      '<div class="mhead"><h2>'+PIN+'<span class="en">'+esc(h.name)+'</span>'+bonusTag(h)+'</h2><div class="mbtns"><button class="btn primary" type="button" data-download="1" id="mdl">Download</button><button class="btn" type="button" data-close="1" id="mclose">Close</button></div></div>'+
      '<div class="bigbox"><b>'+sum(rows)+'</b><span>Couriers needed &middot; '+modal.veh+' &middot; '+rows.length+' zones</span></div>'+
      '<div class="vtabs">'+tabs+'</div><div class="zones">'+rows.map(zoneHTML).join("")+'</div></div></div>';
    document.body.style.overflow="hidden";
    var nov=m.querySelector(".overlay"); if(nov) nov.scrollTop=top;
  }
  function openHub(key,veh){
    var h=hubByKey(key); if(!h) return;
    if(!veh){ var f=VEH.filter(function(x){return h.rows.some(function(r){return r.type===x[0];});})[0]; veh=f&&f[0]; }
    if(!veh) return;
    modal={key:key,veh:veh}; renderModal();
    var c=$("mclose"); if(c) c.focus();
  }
  function buildExport(h){
    var rows=h.rows.filter(function(r){return r.type===modal.veh;});
    var css=Array.prototype.map.call(document.querySelectorAll("style"),function(n){return n.textContent;}).filter(function(t){return t.indexOf("--accent")>-1;}).join("\n");
    var L="<", G=">", X="</";
    var fonts="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap";
    var head=[
      L+"!doctype html"+G, L+"html lang=\"en\""+G, L+"head"+G,
      L+"meta charset=\"utf-8\""+G,
      L+"meta name=\"viewport\" content=\"width=device-width,initial-scale=1\""+G,
      L+"title"+G+esc(h.name)+" - "+modal.veh+X+"title"+G,
      L+"link rel=\"stylesheet\" href=\""+fonts+"\""+G,
      L+"style"+G+css+"\nbody{margin:0;padding:16px}.modal{margin:0 auto}"+X+"style"+G,
      X+"head"+G, L+"body"+G
    ].join("");
    var body='<div class="modal"><div class="mhead"><h2>'+PIN+'<span class="en">'+esc(h.name)+'</span>'+bonusTag(h)+'</h2></div>'+
      (locOf(h)?'<p class="locline">Location: '+esc(locOf(h))+'</p>':'')+
      '<div class="bigbox"><b>'+sum(rows)+'</b><span>Couriers needed &middot; '+modal.veh+' &middot; '+rows.length+' zones</span></div>'+
      '<div class="zones">'+rows.map(zoneHTML).join("")+'</div></div>';
    return head+body+X+"body"+G+X+"html"+G;
  }
  async function downloadHub(){
    if(!modal) return;
    var h=hubByKey(modal.key); if(!h) return;
    var html=buildExport(h), name=h.name.replace(/[^A-Za-z0-9]+/g,"_")+"-"+modal.veh+".html";
    try{
      if(window.claude&&window.claude.use){
        var d=await window.claude.use("downloads");
        if(d){ await d.save({filename:name,data:html}); return; }
      }
    }catch(err){ if(err&&err.code==="declined") return; }
    var url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  function closeModal(){ modal=null; renderModal(); }
  function render(){ renderSummary(); renderTabs(); renderGrid(); renderModal(); }

  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest("[data-area]"); if(!b) return;
    area=b.getAttribute("data-area"); render();
  });
  $("grid").addEventListener("click",function(e){
    var v=e.target.closest("[data-veh]");
    if(v&&!v.disabled){ openHub(v.getAttribute("data-hub"),v.getAttribute("data-veh")); return; }
    var o=e.target.closest("[data-open]");
    if(o) openHub(o.getAttribute("data-open"));
  });
  $("modal").addEventListener("click",function(e){
    if(e.target.closest("[data-popclose]")){ closePop(); return; }
    var pc=e.target.closest("[data-popcopy]");
    if(pc){
      var h2=hubByKey(modal.key);
      if(h2) copyText(locOf(h2)).then(function(){ pc.textContent="Copied"; setTimeout(function(){ pc.textContent="Copy Location"; },1600); });
      return;
    }
    if($("locpop")&&!e.target.closest("#locpop")&&!e.target.closest("[data-loc]")) closePop();
    var t=e.target.closest("[data-mveh]");
    if(t&&!t.disabled){ modal.veh=t.getAttribute("data-mveh"); renderModal(); return; }
    var lb=e.target.closest("[data-loc]");
    if(lb&&!lb.disabled){
      if($("locpop")){ closePop(); return; }
      var hh=hubByKey(modal.key);
      if(hh) openPop(lb,hh);
      return;
    }
    if(e.target.closest("[data-download]")){ downloadHub(); return; }
    var c=e.target.closest("[data-close]");
    if(c&&(c.tagName==="BUTTON"||e.target===c)) closeModal();
  });
  document.addEventListener("keydown",function(e){ if(e.key!=="Escape") return; if($("locpop")){ closePop(); return; } if(modal) closeModal(); });
  $("grid").addEventListener("click",function(e){
    var b=e.target.closest("[data-dlimg]"); if(b&&!b.disabled) downloadImage(b);
  });
  $("q").addEventListener("input",function(e){ query=e.target.value.trim(); renderGrid(); });

  function setStatus(msg,ok){ var s=$("status"); s.textContent=msg; s.className="status"+(ok?" ok":""); }
  $("refresh").addEventListener("click",function(){
    setStatus("Refreshing...");
    fetch(CSV_URL,{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){
      var rs=toRecords(t); if(!rs.length) throw 0;
      records=rs; setVeh(); render(); setStatus("Updated from sheet",true);
    }).catch(function(){ setStatus("Live refresh is not available here. Showing the snapshot from Oct 17, 2026."); });
  });

  records=toRecords($("csv").textContent);
  setVeh();
  render();
  setStatus("Snapshot of the sheet, Oct 17, 2026");
})();
</script>
